<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Partage Simple</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4><i class='bx bx-share-alt'></i> Test Partage Simple</h4>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="testUrl" class="form-label">URL de test :</label>
                            <input type="text" class="form-control" id="testUrl"
                                   value="https://www.google.com" placeholder="Entrez une URL à tester">
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <button class="btn btn-primary" onclick="testShare()">
                                <i class='bx bx-share-alt'></i> Tester le partage
                            </button>
                            <button class="btn btn-success" onclick="testNativeShare()">
                                <i class='bx bx-mobile'></i> Test API Native
                            </button>
                        </div>

                        <div id="testResults" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Conteneur pour les notifications toast -->
    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/qrcode-simple.js"></script>

    <script>
        function testShare() {
            const url = document.getElementById('testUrl').value;
            console.log('=== TEST PARTAGE ===');
            shareQRCode(url, 'Test de partage');
            showResults('Test de partage lancé pour : ' + url);
        }

        function testNativeShare() {
            const url = document.getElementById('testUrl').value;
            console.log('=== TEST API NATIVE ===');
            console.log('navigator.share disponible:', !!navigator.share);
            console.log('User Agent:', navigator.userAgent);
            console.log('Est mobile:', /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));

            if (navigator.share) {
                navigator.share({
                    title: 'Test API Native',
                    text: 'Test de partage via API native',
                    url: url
                }).then(() => {
                    console.log('Partage réussi via API native');
                    showResults('Partage réussi via API native');
                }).catch((error) => {
                    console.log('Erreur API native:', error);
                    showResults('Erreur API native: ' + error.message);
                });
            } else {
                showResults('API Web Share non disponible sur ce navigateur');
            }
        }

        function showResults(message) {
            const container = document.getElementById('testResults');
            container.innerHTML = '<div class="alert alert-info">' + message + '</div>';
        }

        // Afficher les informations du navigateur au chargement
        document.addEventListener('DOMContentLoaded', function() {
            console.log('=== INFOS NAVIGATEUR ===');
            console.log('User Agent:', navigator.userAgent);
            console.log('navigator.share disponible:', !!navigator.share);
            console.log('Est mobile:', /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));

            const container = document.getElementById('testResults');
            container.innerHTML = `
                <div class="alert alert-secondary">
                    <h6>Informations du navigateur :</h6>
                    <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
                    <p><strong>API Web Share:</strong> ${navigator.share ? 'Disponible' : 'Non disponible'}</p>
                    <p><strong>Est mobile:</strong> ${/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ? 'Oui' : 'Non'}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
