services:
  # 1. Base de données MySQL
  db:
    image: mysql:8.0
    container_name: estlc-db
    restart: always
    environment:
      MYSQL_DATABASE: Estlc_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - estlc_db_data:/var/lib/mysql

  # 2. Backend Laravel
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: Estlc-api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=Estlc_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    command: php artisan serve --host=0.0.0.0 --port=8000

  # 3. Frontend React (Vite)
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: Estlc-ui
    ports:
      - "3000:3001" 
    depends_on:
      - backend

volumes:
  estlc_db_data: